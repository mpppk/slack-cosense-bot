name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Wrangler types
        run: bun run cf-typegen

      - name: Check generated Wrangler types are committed
        run: git diff --exit-code -- worker-configuration.d.ts

      - name: Typecheck
        run: bun run typecheck

      - name: Bundle Worker (dry run)
        run: bun run deploy -- --dry-run --containers-rollout=none
